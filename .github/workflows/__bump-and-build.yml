name: "Bump and Build"

on:
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  #############################################################################
  #                               BUMP VERSION                                #
  #############################################################################

  bump-version:
    runs-on: ubuntu-24.04

    outputs:
      new-tag: ${{ steps.next-version.outputs.new_tag }}

    steps:
    - name: "Checkout"
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: "Setup Cache"
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    - name: "Mise Install"
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

    - name: "Generate GitHub App Token"
      id: github-app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ vars.SMYKLOT_APP_ID }}
        private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}

    - name: "Get GitHub App User ID"
      id: get-user-id
      env:
        APP_SLUG: ${{ steps.github-app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
      run: echo "user-id=$(gh api "/users/${{ env.APP_SLUG }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

    - name: "Set Commiter"
      env:
        APP_SLUG: ${{ steps.github-app-token.outputs.app-slug }}
        USER_ID: ${{ steps.get-user-id.outputs.user-id }}
      run: |
        git config --global user.name '${{ env.APP_SLUG }}[bot]'
        git config --global user.email '${{ env.USER_ID }}+${{ env.APP_SLUG }}[bot]@users.noreply.github.com'

    - name: "Calculate the Next Version"
      id: next-version
      uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
      with:
        github_token: ${{ steps.github-app-token.outputs.token }}
        dry_run: true

    - name: "Bump version in Cargo.toml"
      env:
        NEW_VERSION: ${{ steps.next-version.outputs.new_version }}
      run: .github/scripts/bump-cargo.bash

    - name: "Regenerate Documentation"
      run: |
        mise run clean::gen::docs::markdown ::: gen::docs::markdown
        cargo genman

    - name: "Generate shell completions"
      run: |
        mkdir -p dist/completions
        cargo run -- completions bash > dist/completions/af.bash
        cargo run -- completions fish > dist/completions/af.fish
        cargo run -- completions zsh > dist/completions/_af

    - name: "Upload generated manual page"
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: af-manpage
        path: docs/man/man1/af.1
        if-no-files-found: error

    - name: "Upload generated shell completions"
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: af-completions
        path: dist/completions
        if-no-files-found: error

    - name: "Commit and tag new version"
      env:
        NEW_TAG: ${{ steps.next-version.outputs.new_tag }}
        GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
      run: .github/scripts/commit-tag-version.bash

  #############################################################################
  #                               DEFINE MATRIX                               #
  #############################################################################

  define-matrix:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}

    steps:
    - name: "Define Matrix"
      id: define-matrix
      run: |
        echo "matrix=$(cat <<'EOF' | jq --compact-output .
          {
            "include": [
              {
                "name": "macos-arm64",
                "runner": "macos-15",
                "target": "aarch64-apple-darwin",
                "archive_os": "darwin",
                "archive_arch": "arm64",
                "openssl_dir": "/opt/homebrew/opt/openssl"
              },
              {
                "name": "macos-amd64",
                "runner": "macos-15-intel",
                "target": "x86_64-apple-darwin",
                "archive_os": "darwin",
                "archive_arch": "amd64",
                "openssl_dir": "/usr/local/opt/openssl"
              },
              {
                "name": "linux-amd64",
                "runner": "ubuntu-24.04",
                "target": "x86_64-unknown-linux-gnu",
                "archive_os": "linux",
                "archive_arch": "amd64",
                "openssl_dir": ""
              },
              {
                "name": "linux-arm64",
                "runner": "ubuntu-24.04-arm",
                "target": "aarch64-unknown-linux-gnu",
                "archive_os": "linux",
                "archive_arch": "arm64",
                "openssl_dir": ""
              }
            ]
          }
        EOF
        )" >> "$GITHUB_OUTPUT"

  #############################################################################
  #                              BUILD ARTIFACTS                              #
  #############################################################################

  build-artifacts:
    runs-on: ${{ matrix.runner }}

    needs:
    - bump-version
    - define-matrix

    env:
      VERSION: ${{ needs.bump-version.outputs.new-tag }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
    - name: "Checkout"
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ needs.bump-version.outputs.new-tag }}

    - name: "Install Rust"
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable (uses major version tagging)
      with:
        targets: ${{ matrix.target }}
        toolchain: stable

    - name: "Setup Cache"
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    - name: "Download generated manual page"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: af-manpage
        path: docs/man/man1

    - name: "Download generated shell completions"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: af-completions
        path: dist/completions

    - name: "Build release binary"
      run: |
        if [ -n "${{ matrix.openssl_dir }}" ]; then
          export OPENSSL_DIR="${{ matrix.openssl_dir }}"
        fi

        cargo build \
          --target ${{ matrix.target }} \
          --verbose \
          --locked \
          --release

    - name: "Package release archive"
      id: package
      env:
        ARCHIVE_OS: ${{ matrix.archive_os }}
        ARCHIVE_ARCH: ${{ matrix.archive_arch }}
      run: |
        mkdir -p dist/package

        version="${VERSION#v}"
        archive_name="${{ github.event.repository.name }}_${version}_${ARCHIVE_OS}_${ARCHIVE_ARCH}.tar.gz"
        package_dir="dist/package/${{ github.event.repository.name }}"

        rm -rf "$package_dir"
        mkdir -p "$package_dir"
        cp "target/${{ matrix.target }}/release/${{ github.event.repository.name }}" "$package_dir/${{ github.event.repository.name }}"
        cp "docs/man/man1/${{ github.event.repository.name }}.1" "$package_dir/${{ github.event.repository.name }}.1"
        mkdir -p "$package_dir/completions"
        cp dist/completions/af.bash "$package_dir/completions/af.bash"
        cp dist/completions/af.fish "$package_dir/completions/af.fish"
        cp dist/completions/_af "$package_dir/completions/_af"

        tar -C "dist/package" -czf "dist/${archive_name}" "${{ github.event.repository.name }}"
        echo "archive_path=dist/${archive_name}" >> "$GITHUB_OUTPUT"

    - name: "Upload ${{ matrix.name }} artifacts"
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      if: success()
      id: upload-artifacts
      with:
        name: ${{ github.event.repository.name }}-${{ matrix.name }}
        path: ${{ steps.package.outputs.archive_path }}
        if-no-files-found: error

    ################################# DEBUG #################################

    - name: "Initialize Debug Shell"
      if: vars.FORCE_DEBUG_SHELL == 'true' || failure() && runner.debug == '1'
      env:
        TUNSHELL_SECRET: ${{ secrets.TUNSHELL_SECRET }}
      run: .github/scripts/debug-shell.bash

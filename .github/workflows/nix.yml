name: "Nix"

on:
  pull_request:
    branches:
    - "main"
    paths:
    - "flake.nix"
    - "flake.lock"
    - "src/**/*"
    - "Cargo.*"

  push:
    branches:
    - "main"
    paths:
    - "flake.nix"
    - "flake.lock"
    - "src/**/*"
    - "Cargo.*"

  schedule:
  - cron: "0 0 1 * *"

  merge_group: {}

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nix-build:
    runs-on: ubuntu-26.04
    environment: ci

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: "Install Nix"
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

    - name: "Build with Nix"
      run: nix build .#af --print-build-logs

    - name: "Verify binary"
      run: ./result/bin/af --version

    - name: "Check flake"
      run: nix flake check

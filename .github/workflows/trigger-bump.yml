name: "Trigger Bump"

on:
  schedule:
  - cron: "0 1 * * *"

  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  ##############################################################################
  #                            CHECK IF SHOULD BUMP                            #
  ##############################################################################

  check-if-should-bump:
    runs-on: ubuntu-26.04

    outputs:
      bump: ${{ steps.should-bump.outputs.bump }}

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: "Define if version should be bumped"
      id: should-bump
      run: |
        last_tag="$(git describe --tags --abbrev=0)"
        changed="$(git diff --name-only "$last_tag" HEAD -- .github/scripts .github/workflows src Cargo.toml Cargo.lock xtasks)"
        if [[ -n "$changed" ]]; then
          echo "bump=true" >> "$GITHUB_OUTPUT"
        fi

  ##############################################################################
  #                               BUMP AND BUILD                               #
  ##############################################################################

  bump-and-build:
    needs: check-if-should-bump
    if: needs.check-if-should-bump.outputs.bump == 'true'
    uses: ./.github/workflows/__bump-and-build.yml
    secrets: inherit

name: "Trigger Bump"

on:
  schedule:
  - cron: "0 1 * * *"

  workflow_dispatch: {}

permissions:
  contents: read

# Two runs at once could both read the same previous tag and release twice.
concurrency:
  group: trigger-bump-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  ##############################################################################
  #                            CHECK IF SHOULD BUMP                            #
  ##############################################################################

  check-if-should-bump:
    # On other branches the tag action gives a preview version, and the bump
    # job would commit and tag it there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    outputs:
      bump: ${{ steps.next-version.outputs.new_version != '' }}

    steps:
    # The tag action falls back to local git when the compare API fails.
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # Same action as the bump-version job, so both pick the same previous tag
    # and skip the same commits. It gives no version when nothing is eligible.
    - name: "Check for releasable commits"
      id: next-version
      uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
      with:
        github_token: ${{ github.token }}
        dry_run: true
        path_filter: ".github/scripts,.github/workflows,src,Cargo.toml,Cargo.lock,xtasks"

  ##############################################################################
  #                               BUMP AND BUILD                               #
  ##############################################################################

  bump-and-build:
    needs: check-if-should-bump
    if: needs.check-if-should-bump.outputs.bump == 'true'
    uses: ./.github/workflows/__bump-and-build.yml
    secrets: inherit

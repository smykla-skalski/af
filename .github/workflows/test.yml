name: "Tests"

on:
  pull_request:
    branches:
    - "main"
    paths:
    - "src/**/*"
    - "Cargo.*"

  push:
    branches:
    - "main"
    paths:
    - "src/**/*"
    - "Cargo.*"

  schedule:
  - cron: "0 0 1 * *"

  merge_group: {}

  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04
    environment: ci

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: "Run tests"
      run: cargo test --verbose

name: "Tests"

on:
  pull_request:
    branches:
    - "main"
    paths:
    - "src/**/*"
    - "Cargo.*"

  push:
    branches:
    - "main"
    paths:
    - "src/**/*"
    - "Cargo.*"

  schedule:
  - cron: "0 0 1 * *"

  merge_group: {}

  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04
    environment: ci

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: "Run tests"
      run: cargo test --verbose

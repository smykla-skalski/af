name: "Release"

on:
  push:
    tags:
    - "v*.*.*"

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WORKFLOW_TO_WATCH: trigger-bump.yml

jobs:
  release:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write # necessary for generating artifact attestations
      attestations: write # necessary for generating artifact attestations

    steps:
    - name: "Checkout"
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: "Generate GitHub App Token"
      id: github-app-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ vars.SMYKLOT_APP_ID }}
        private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}

    - name: "Generate Homebrew Tap Token"
      id: homebrew-tap-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ vars.SMYKLOT_APP_ID }}
        private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
        owner: smykla-skalski
        repositories: homebrew-tap

    - name: "Get last bump version workflow run"
      id: get-last-workflow-run-id
      env:
        GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
      run: |
        echo "id=$(
          gh run list \
            --workflow "${{ env.WORKFLOW_TO_WATCH }}" \
            --limit 1 \
            --json databaseId \
            --jq '.[] | .databaseId'
        )" >> "$GITHUB_OUTPUT"

    - name: "Wait for run to finish"
      env:
        GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
      run: gh run watch ${{ steps.get-last-workflow-run-id.outputs.id }} --exit-status

    - name: "Get artifacts"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ steps.github-app-token.outputs.token }}
        run-id: ${{ steps.get-last-workflow-run-id.outputs.id }}
        path: dist

    - name: "Generate artifacts attestation"
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      with:
        subject-path: dist/**/${{ github.event.repository.name }}_*

    - name: "Add release artifacts"
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        token: ${{ steps.github-app-token.outputs.token }}
        files: dist/**/${{ github.event.repository.name }}_*
        make_latest: true
        generate_release_notes: true

    - name: "Trigger Homebrew Tap Update"
      env:
        GH_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
        VERSION: ${{ github.ref_name }}
      run: |
        gh api repos/smykla-skalski/homebrew-tap/dispatches \
          --method POST \
          --raw-field "event_type=af-release" \
          --field "client_payload[version]=${VERSION#v}" \
          --field "client_payload[repository]=${GITHUB_REPOSITORY}"
